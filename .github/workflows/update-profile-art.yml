name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update-profile-art.yml"]

permissions:
  contents: write

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: gabsh
      - run: python scripts/render_heatmap_svg.py
      - run: python scripts/prep_photo.py
        env:
          GH_USER: gabsh
      - run: python scripts/make_info_card.py
      - name: Refresh Tokscale card
        run: curl -sSfL -m 30 -o tokscale.tmp https://tokscale.ai/api/embed/gabsh/svg && mv tokscale.tmp tokscale.svg
        continue-on-error: true
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg info-card.svg tokscale.svg"
